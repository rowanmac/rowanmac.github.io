- id: mhathunaUdairBhlascaoidAgus2026
  abstract: <p>Tá mórán airde tugtha ag léitheoirí agus ag criticeoirí ar fud an domhain ar scéalta beatha an Bhlascaoid ó foilsíodh na chéad saothair i bhfichidí agus i dtríochaidí an fhichiú haois. San alt seo, déantar mionléamh ar thuiscintí Thomáis Uí Chriomhthain air féin, faoi mar a léirítear iad in *An tOileánach*, a foilsíodh den chéad uair sa bhliain 1929. Déantar scagadh chomh maith ar an léiriú a thugtar ar an ngné seo dá fhéiniúlacht i scríbhinní eile dá chuid, cuid acu ar téacsanna gearra iad nár foilsíodh ina n-iomláine go dtí seo. Aithnítear an mhuinín a bhí ag an gCriomhthanach as a chumas féin i réimsí éagsúla den saol agus déantar anailís ar an mbéim a leag sé ar a ról mar údar. Déantar iniúchadh chomh maith ar thagairtí gaolmhara do chúrsaí léitheoireachta agus scríbhneoireachta in *Cín Lae Eibhlín Ní Shúilleabháin* (2000), saothar nár tugadh an aird chéanna air go fóill agus a bhfuil léiriú luachmhar le fáil ann ar an léitheoireacht mar ghnáthchuid de shaol na mná óige seo ar an mBlascaod.</p>
