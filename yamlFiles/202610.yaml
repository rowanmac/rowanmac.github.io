- id: beaumontSolidarityFriendshipWomens2026
  abstract: 'This article argues for a re-appraisal of Anglo-Irish relations in the mid-twentieth century. We challenge dominant narratives within the historiography which have foregrounded political division, disruption and violence. Our counter narrative is achieved by interrogating the history of Anglo-Irish relations through the lens of non-combatant and non-party political women’s activism. Consequently, the article reveals an overlooked history of solidarity, friendship and cross-borders co-operation via the case-studies of five popular voluntary women’s organisations. These are: the Mothers’ Union; the Girls’ Friendly Society; the Irish Countrywomen’s Association; the Federation of Women’s Institutes of Northern Ireland and the National Federation of Women’s Institutes. By tracing the everyday ‘quiet’ activism of these grassroots women’s organisations from the 1920s to the 1970s, we evidence how they nurtured dynamic networks of solidarity across the island of Ireland, and in Britain. Their endeavours were sustained over time by a shared desire to enhance the lives of women and girls. Our analysis offers fresh insights and opens up new debates about multiple expressions of female activism. In doing so we re-shape understandings of women’s grassroots activism and highlight its impact on twentieth century Anglo-Irish history.'
