- id: jarmanWritingPaleIrish2026
  abstract: In his groundbreaking work, Cody D. Jarman explores the phrase "beyond the Pale" for describing both the Irish Revival and the Harlem Renaissance. In medieval Ireland, "the Pale" referred to the area immediately surrounding Dublin where the Normans maintained political control. Popular histories of the phrase draw on notions of the native Irish as savage and, thus, to be "beyond the Pale" is to be uncivilized, uncontrollable, and offensive.   Jarman suggests a different relationship between the Irish and this construction of civilization as a protected enclave threatened by racial outsiders. In their attempts to project an anticolonial cultural Nationalism, Ireland’s revivalists made Irish cultural production into a kind of Pale, a boundary line that reinforced whiteness as a stable political and social identity. This becomes more apparent through an extended comparison with the Harlem Renaissance, a revivalist movement that was made up of artists and thinkers committed to functioning "beyond the Pale." By reimagining the relationship between racial identity and political and cultural belonging, Harlem Renaissance artists constructed a sense of cultural identity that was, simultaneously, cohesive and permeable.   Through comparative readings of major figures from each movement and a robust engagement with Black studies theory, Writing the Pale exposes the white supremacist assumptions underlying the Irish Revival’s construction of Irish identity, as well as the expansive theoretical implications of the Harlem Renaissance’s defense of Black life.
