- id: mcgintyTheyWereBoth2026
  abstract: This article examines Gaelic succession in early modern Ireland and describes its impact on political stability within clans. Referred to as tanistry, Gaelic succession had several characteristics that contributed to internal clan succession disputes. Tanistry included a designated successor known as the *tánaiste*, who was often a prominent member of the clan. This prominence made them a potential rival to the ruling chieftain due to their significant influence. Gaelic succession also had an elective component and unclear criteria used to determine who should succeed. This made multiple claimants to the chieftainship possible, and could lead to disagreement and sometimes internecine wars of succession. Succession was further complicated by the presence of the English, who attempted to introduce primogeniture into Ireland and so, there were two modes of succession in Early Modern Ireland. The English also helped exacerbate internal clan violence as they played clan rivals off each when it suited them.</p>
