- id: mcguireCastlereaghBrianMaguire2026
  abstract: 'This article examines how the Northern Ireland trade union movement confronted state repression during the Troubles, focusing on the short-lived Trade Union Campaign Against Repression (TUCAR) and the death of AUEW-TASS shop steward Brian Maguire in Castlereagh RUC barracks in May 1978. It argues that TUCAR’s activism exposed a central contradiction within organised labour: leaderships were troubled by repression yet remained institutionally bound to the Northern state. Drawing on a range of archival sources, press coverage, and trade union records, the article reconstructs several campaigns around state repression in Northern Ireland. It demonstrates how the political weakness of the labour movement led it to seek partnership with the state, limiting union responses to repression, even amid mounting evidence of brutality. The failure to mount an independent labour response to repression led to the emergence of TUCAR, which was a marginal actor, rooted in the nationalist community. This reinforced a flawed, dangerous perception that repression was a nationalist issue. The article concludes that trade unions were uniquely positioned to articulate a class-based critique of state violence but ultimately failed to do so.'
