- id: breatnachCumamCroinicChloinn2026
  abstract: <p>Uair éigin i rith an cheathrú ráithe den bhliain 1598 tar éis d’Aodh Ó Néill cath éachtach a throid agus a bhuachan i gcoinne fhórsaí na Banríona faoi cheannas Marascál Henry Bagenal ag an Áth Buí *ar Abhainn Mhóir don taobh tuaidh d’Ard Macha*, iarradh mar choimisiún ar an saoi le croiniceacht, Dubhthach Óg Ó Duibhgeannáin, ó Sheanchua i gCo Shligigh ó dhúchas, dán a chumadh ag comóradh an mhórbhua mhíleata a rugadh, agus ag ceiliúradh fhear an bhua a bhreith go glórmhar ina cháilíocht mar cheann ar a chine agus mar fhear iompair an teidil Ó Néill Mór. In *Cumam croinic do Chloinn Néill* tá áireamh déanta orthu siúd ar ar baisteadh an teideal sin ó aimsir Néill Óig Uí Néill (1397–1403) i leith, agus ar fhaid na mblianta a rialaíodar ina nduine is ina nduine anuas go dtí Aodh féin, a raibh trí bliana dá réimeas caite aige mar Ó Néill Mór ag am cumtha an dáin.</p>
