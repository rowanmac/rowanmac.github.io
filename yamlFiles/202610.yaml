- id: chambersFilmIrelandThird2026
  abstract: "The article explores how the Irish struggle for independence was\nused by the Third Reich as a narrative template for the feature\nfilms \nDer Fuchs von Glenarvon(The fox of Glenarvon, 1940) and \nMein Leben für Irland(My life for Ireland, 1941). Intended\nfor German and continental European audiences in the early years of\nwar, the films show how Third Reich cinema mobilized British\ncolonial abuses of power for their own propaganda purposes. Through\nanalysis of a range of original archival sources, this article\nconsiders how Ireland was used as a topical example of British\noppression by Goebbels’ propaganda ministry and also as an index\nfor the reorganization of European art and culture under the Nazi\nregime."
