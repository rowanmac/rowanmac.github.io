- id: anluainSoundingIrelandRadio
  abstract: 'At 7.45pm on 1 January 1926, a crackling voice over the airwaves marked the beginning of public broadcasting in Ireland. From that first transmission by 2RN - the precursor to RTÉ - Sounding Ireland: Radio and the Making of Us traces a remarkable story of a nation through what and how we heard ourselves across a century.  In moments of triumph and challenge, in English and Irish, RTÉ has been a trusted national voice - recording Irish life and bringing people together for shared experiences that define generations. Richly detailed, extensively illustrated and deeply insightful, Sounding Ireland is both a celebration and a reflection of RTÉ Radio and a century of stories told, voices heard and memories made.'
