- id: livelyRevolutionaryConnectionsRussia
  abstract: >-
    From the late nineteenth century, Ireland featured prominently in Russian
    liberal, conservative, and radical debates about land politics,
    self-determination, and empire. Equally, Irish commentators from across the
    political spectrum used Russia as a lens onto questions of imperialism,
    anti-imperialism, and socialism. But while the Irish and Russian
    revolutionary contexts are well-studied in isolation, their myriad
    political, social, and cultural entanglements are not.Drawing on extensive
    Russian and Irish archival accounts, newspapers, diaries, letters, memoirs,
    literary, and visual sources, Revolutionary Connections looks in both
    directions at Irish responses to Russian revolutionary change and at
    representations of Ireland in Russian-language texts from the 1905 Russian
    Revolution to the end of the Irish Civil War in 1923. The result is a unique
    account of international engagement in revolutionary Russia and Ireland and
    of how Ireland was imagined beyond the Anglophone world. This mutual, if
    selective and conditional, engagement reflected wider technological changes
    in news communication and the expansion of international news agencies.
    Diasporic networks, including in Britain and the US, helped to shape
    Russo-Irish relations and Irish publications and political actors engaged
    with different parts of the Russian empire, including Ukraine, Finland, and
    Poland.Through five thematic chapters, the book considers Russo-Irish
    relations from contrasting and often overlooked angles, including Irish
    eyewitness experiences on the Eastern front during World War One and
    religious perspectives. Using a transnational methodology and expansive
    source base, the book offers a fresh angle on the entangled history of
    revolutions in the early twentieth century and the translation of news and
    ideas across borders.
