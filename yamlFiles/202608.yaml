- id: sisleySarahPurserDevelopment2026
  abstract: >-
    The painter Sarah Purser (1848–1943) was an indomitable figure in the Irish
    cultural scene of her day. She played a significant role in two of Dublin’s
    art museums, the Municipal Gallery of Modern Art (now Hugh Lane Gallery) and
    the National Gallery of Ireland (NGI). A close friend of the art dealer,
    collector, and philanthropist Hugh Lane, Purser was pivotal in the founding
    of the Municipal Gallery and she later secured Charlemont House for its
    permanent home. She served on the Board of Governors and Guardians of the
    NGI from 1909 to 1943, providing continuity during turbulent times. Her
    sharp intellect, knowledge of art, and social connections ensured that she
    was a valued advocate for both the NGI and Hugh Lane Gallery across four
    decades. A significant collector herself, she established the Friends of the
    National Collections of Ireland to support public museums, with the
    Municipal Gallery and the NGI being among the first beneficiaries of this
    philanthropy. Under her leadership the Friends campaigned for the return to
    Dublin of the paintings in the Sir Hugh Lane Bequest 1917 (now shared in
    partnership between the National Gallery, London, and Hugh Lane Gallery).
    She also founded and managed the stained-glass studio An Túr Gloine and
    helped to organise numerous exhibitions.
