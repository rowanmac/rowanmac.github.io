- id: connollyWomenViolenceTwentiethCentury
  abstract: >-
    Women, Violence and Twentieth Century Warfare explores the unspoken and
    hidden impact of war and violent conflict on women, focusing on the case
    study of Ireland within a broader framework of ethical remembrance.The
    violence experienced in the decades after the Irish revolution (1919-23), up
    to the period encompassing the later “Troubles” in Northern Ireland
    (1968-98) left enduring social and psychological impacts on society, both in
    and outside of Ireland. Linda Connolly clearly and systematically
    synthesises these experiences into a narrative picture which incorporates
    in-depth research conducted across multiple sources and documents. The book
    explores the wider relationship between war, gender and violence in
    twentieth century conflicts, using examples such as forced hair taking,
    sexual violence, psychological trauma, and migration. Coming up to the end
    of the twentieth century, the volume sheds light not only on what happened
    to women during revolution, but also long after, as well as addressing
    questions around why women experienced violence in the way they did.Bringing
    together ideas from feminist theories of war, women’s history, and
    trauma-informed research, this book will be of interest to students and a
    scholars of Gender Studies and Irish Studies internationally.
