- id: millerEpidemicBelfastHealth2026
  abstract: |-
    Since 2021, the Epidemic Belfast project has developed
    innovative ways of researching and communicating health history
    with regional and international audiences. This article reviews the
    project's development while offering insight into how best to
    develop practice for curating health history content that is
    inclusive, coproduced, and challenging. It situates the Epidemic
