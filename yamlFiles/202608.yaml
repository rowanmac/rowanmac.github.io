- id: mcdiarmidMoralReformFinancial2026
  abstract: >-
    This article examines the emergence of temperance tontines as an
    intersection of financial innovation and moral reform. Tontines operated by
    temperance societies represented a distinctive evolution of the traditional
    tontine principle, transforming survivorship-based investment schemes into
    tools for economic support and social and behavioural change. While tontines
    had historically linked health and longevity to financial returns, Irish
    temperance societies fundamentally reimagined their purpose. Drawing on data
    from the Registry of Friendly Societies, contemporary pamphlets, and
    newspaper reports, this article shows that temperance societies played an
    important role in early mutual aid tontine activity (1833–1845). This was
    short-lived: only nine temperance tontines were created after 1850, while at
    least 98 mutual aid tontines emerged from other groups throughout the
    remainder of the nineteenth century. By examining tontines within the
    broader context of Father Theobald Mathew's temperance movement, this
    research demonstrates how moral reformers creatively harnessed financial
    structures to advance social change, establishing foundations for later
    developments in Irish mutual aid mechanisms.
