- id: pottertonMoynaghLoughStudies2024
  abstract: Moynagh Lough is one of the most significant archaeological sites ever discovered in Ireland. From 1980 to 1998 excavations were directed by John Bradley. This exceptional multi-period wetland site yielded a rich artefactual assemblage from multiple levels and phases – Mesolithic, Neolithic, Bronze Age and medieval. Over the years, Bradley produced interim reports and published several articles about the findings, but when he passed away suddenly in 2014, the final excavation report remained incomplete. The Moynagh Lough Project was re-established in 2018 and several strands of post-excavation research have been completed. With twenty essays by a field of national and international experts and specialists, Moynagh Lough Studies is the first book-length volume dedicated to this important archaeological site.
