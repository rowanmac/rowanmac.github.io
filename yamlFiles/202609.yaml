- id: hadfieldPersonalPoliticalFeminism2026
  abstract: "Shaw’s biographers have most commonly presented his wife\nCharlotte as a subservient helper, whose main achievement was\neliminating domestic distractions so that her husband could focus\non his important work. Even Charlotte’s own biographer largely\npresented her that way, and more recent feminist criticism still\ntends to conclude that Charlotte defined herself in relation to her\nhusband. Charlotte’s own pathological aversion to publicity only\ncontributes to this assumption that she had no independent self or\nambitions. However, increasing access to a variety of archival\nsources reveals that Charlotte Shaw’s contemporaries did not\nnecessarily see her as merely an “echo” of her husband, nor did she\nsee herself that way. This article begins to uncover the ways that\nCharlotte demonstrated her own strong commitment to feminism and\nIrish independence apart from her husband’s more equivocal stand on\nthose issues."
