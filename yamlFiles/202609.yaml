- id: togoresItExpedientThat2026
  abstract: "This article compares the two 1923 plays through the plot of\nmartyrdom as a discourse of contestation. The audience is faced\nwith a female character undergoing a process of martyrdom—Joan of\nArc and Minnie Powell—while the playwrights use them and the\nbackgrounds and themes of the plays to discuss armed nationalism,\nclass issues, and the active nature of women’s utopian beliefs.\nThere are, however, marked differences between the two plays as\nfemininity defines the character of Minnie while the lack of it\ndefines that of Joan, and as \nThe Shadow of a Gunmanis definitely rooted in an Irish\ncontext while \nSaint Joandistances itself from it to the point where it\nis rarely defined as an Irish play. Because, in part, of the\nsimilarities between O’Casey and Shaw as much as because of their\n“Irishness,” their staging of the plot of martyrdom as a spectacle\nis a way to subvert the hegemonic discourse of the\nnation-in-creation as regards to the place of women in it. Joan and\nMinnie come to represent the subalterns of their society and try,\nunsuccessfully, to make themselves heard by the ones who could\nchange the established order—the audience."
