- id: robertsonDreamMadmanProphecy2026
  abstract: "This article explores how Shaw’s \nJohn Bull’s Other Islandand E. B. Corbett’s \nA New Amazoniause speculative futures to provoke critical\nreflection rather than present idealized utopias. \nA New Amazoniaprophesies a future society revolutionized\nby feminist domestic reforms and urban planning, yet its vision is\ncomplicated by embedded racial hierarchies and eugenic practices.\nThe narrator’s ambivalent response invites readers to reconsider\nthe costs and contradictions of such futures. In \nJohn Bull’s Other Island, competing visions clash:\nBroadbent’s romantic but colonialist Garden City proposal contrasts\nwith Keegan’s melancholic, prophetic critiques of capitalism and\nimperialism. Keegan’s “dream” serves not as escapism but as a form\nof imaginative engagement that exposes the limits of political\nidealism. Both texts resist static or totalizing visions of utopia\nand instead foster a dynamic process of imaginative contemplation\nthat reflects on social realities, interrogates ideological\nframeworks, and creates space for intellectual growth."
