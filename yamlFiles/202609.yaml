- id: fabbriManyLivesEdmund2026
  abstract: 'This historiographical review maps and scrutinizes the interpretative traditions that have grown around Edmund Burke’s thought since the 1790s, identifying three distinctive strands of criticism: the Victorian utilitarian/proto-liberal interpretation, the Namierite analysis of Burke, and the North American natural law tradition. It then turns to the recent archival and contextual scholarship that has largely superseded these schemata – the biographies of F. P. Lock and Richard Bourke, the analysis of J. G. A. Pocock, and the imperial and global perspectives of P. J. Marshall and others – which relocates Burke within the political crises and colonial contexts in which he wrote. This reorientation has been underpinned by the modern editorial projects behind his Correspondence and Writings and speeches. Rather than adjudicating who Burke was, the review traces how successive generations have read, reframed, and instrumentalized his prima facie contradictions, suggesting that his resistance to classification reflects less a defect in the literature than the enduring richness of its subject.'
