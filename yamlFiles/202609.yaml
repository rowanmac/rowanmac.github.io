- id: christianEnglishQueenIrish2026
  abstract: "This article examines depictions of Elizabeth I in two\nIrish-authored plays from the early twentieth century, Lady\nGregory’s \nThe Canavansand Shaw’s \nThe Dark Lady of the Sonnets. Both dramatists had, in\nearlier plays, used women as symbols to dramatize the plight of\ncolonized Ireland and the struggle for independence. Their\nportrayals of Elizabeth, showing her as person, myth, and English\nicon, offered a more indirect commentary on Irish-English\nrelations. Both plays borrowed from a variety of images of the\nQueen circulated in Ireland and England from the fifteenth century\nto the twentieth, ranging from grotesque monster to fairy queen.\nThe dramatists use humor and irony to hold these worshipful and\ndemonizing images at arm’s length, suggesting that Elizabeth’s\nsymbolic personae are tools that can be used by shrewd\ncommunicators not only to buttress English authority, but also to\nsubvert it."
