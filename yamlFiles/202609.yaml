- id: gahanBernardShawPortrait2026
  abstract: "This biographical article traces young adult Bernard Shaw’s\ninteractions with Irish—as well as some significant\nnon-Irish—people during his first twenty-two years living in London\nin order to give an idea of what being Irish meant in the Imperial\ncapital at the end of the nineteenth century. This first part\ncovers the eighteen years from 1876 to just before his first London\ntheatrical success. The second part (to be published in a future\nissue of \nSHAW) will begin with that 1894 Avenue Theatre Season and\nconclude four years later in May and June 1898, when the\nforty-one-year-old Irish socialist’s life took a completely new\nturn with the publication of his first two volumes of plays (\nPlays Pleasant and Unpleasant), his becoming a full-time\ndramatist on retiring as a full-time critic, and his marriage to\nIrishwoman Charlotte Payne-Townshend. Taken together, these Irish\nconnections of the early London years laid the foundations for\nShaw’s considerable involvement in Irish affairs, cultural and\npolitical, in the first quarter of the twentieth century."
